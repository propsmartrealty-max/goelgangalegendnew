name = "goelgangalegend"
pages_build_output_dir = "dist"
compatibility_date = "2026-05-01"
compatibility_flags = ["nodejs_compat"]

# Cloudflare R2 Object Storage Binding for 4K Media & Large Documents (Zero Egress Fees)
[[r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "goelgangalegend-assets"

# Cloudflare KV Storage Binding for Sovereign Leads & Cache Storage
[[kv_namespaces]]
binding = "LEADS_KV"
id = "goelgangalegend_leads_kv"

[vars]
ENVIRONMENT = "production"
ADMIN_TOKEN = "gglc_edge_admin_2026"
