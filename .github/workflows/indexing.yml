name: Search Engine Indexing Automation (Google & Bing)

on:
  schedule:
    # Run once daily at 00:00 UTC (5:30 AM IST) to submit pages within daily quota limits
    - cron: '0 0 * * *'
  workflow_dispatch:
    # Allows manual trigger from the GitHub Actions dashboard
  repository_dispatch:
    # Allows triggering via external git webhooks / API calls
    types: [trigger-indexing]

jobs:
  index:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests google-auth

      - name: Create Google Credentials JSON
        run: |
          echo "${{ secrets.GOOGLE_CREDENTIALS }}" > google-credentials.json

      - name: Run Google Indexing API
        run: |
          python3 scratch/index_legend.py

      - name: Run Bing IndexNow Pinger
        run: |
          python3 scratch/ping_indexnow.py
